[mod]
id          = "boss-health"
name        = "Boss Health"
version     = "1.1.0"
author      = "Ovilli"
summary     = "The boss bar shows the boss's current health next to its name."
description = "Adds the boss's current health, updated live, next to its name on the boss life bar. Data only: nothing in the game is changed but the boss bar."
enabled     = false
load_order  = 61
sdk_version = ">=3.0,<4"
# UI only: each player sees the number on their own screen. HP is host-owned;
# a client shows the replicated value.
multiplayer_scope = "cosmetic"
license     = "MIT"
tags = ["bosses", "hud"]

# Boss bar: the boss name label shows a String Format "<name>   <HP>" —
# input 0 the name it always showed (Name Get Value, read as text), input 1
# current HP from the listener the bar's own gauge reads (accessor 0x1acadef8).
[[content]]
kind   = "entity"
id     = "boss_bar_hp"
entity = "GameUis/Common_Ui/Life_Bar_Boss_Common"

[[content.steps]]
label_format = "Boss Name"
text         = "{0}   {1}"
inputs = [
    { node = "Name Get Value", accessor = 0x16abf2f0, type = "text" },
    { node = "GameUis\\Common_Ui\\Life_Bar_Common.entity.ot|Dt Entity Hittable Listener", accessor = 0x1acadef8, type = "number" },
]
