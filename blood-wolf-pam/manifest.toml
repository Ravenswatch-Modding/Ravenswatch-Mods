# Blood Wolf, written from scratch (no base hero).
#
# Until 0.1.0 Blood Wolf was a clone of Scarlet locked into her wolf form: a
# copy of her whole family with ~90 graph edits on top. From 0.2.0 nothing of
# Scarlet's is copied. Its entities (engine/hero_frame.py), buttons
# (engine/hero_ability.py) and roster record (engine/herodef_frame.py) are
# written from this file on the shared hero base; Scarlet (the rig) lends
# ASSETS only: the wolf's mesh, skeleton, clips, effects and button pictures.
# The clone manifest is kept at ~/.cache/rsmm/blood-wolf-kit/manifest.clone.toml.
#
# What the clone had that this file says in its own way (see the notes at each
# button): the blood seed riding on the bitten enemy, and buttons and talents
# of Blood Wolf's own rather than Scarlet's.

[mod]
id                = "blood-wolf-pam"
name              = "Blood Wolf"
version           = "0.3.1"
author            = "Local"
description       = "Blood Wolf: a wolf hero of its own, written from scratch on Scarlet's wolf assets."
license           = "MIT"
sdk_version       = ">=3.0,<4"
enabled           = false
multiplayer_scope = "deterministic-shared"
experimental      = true
tags              = ["hero", "red"]
loader_flags      = ["RSMM_ENABLE_HERO_CAPTURE"]

# The power is a `template` (Scarlet's own wolf bite) and the build fixes the
# combo and the talent cards need: CLI channel v33 (RSMM 5.9.32) or newer. An
# older RSMM skips the mod with a plain message instead of keeping the last
# build it made (what "nothing changes between versions" looked like).
[requires]
cli    = 33
loader = 65

[[content]]
kind        = "hero"
id          = "BloodWolf"
name        = "Blood Wolf"
description = "The wolf that never turned back. It hunts in a pack of its own making, and everything it bites bleeds."

[content.frame]
rig      = "Hero_Red"
mesh     = "Characters\\Heroes\\RED\\RED_wolf_GEO.fbx"
model    = "art/bloodwolf_GEO.glb"
material = "Characters\\Heroes\\RED\\Textures\\M_RED_Wolf.mat.ot"
# The wolf's own HUD portrait (the rig's default is Scarlet, human).
portrait = "Heroes\\Red\\Portrait_RED_WOLF_01.png"

# Pam's seed, step for step from the clone, on the bite's own damage record
# (Scarlet's "Wolf Primary Ability Damage", lent with the power's template, as
# in the clone). Carmilla's seed debuff and its burst listener + spawner.
edits = [
    { clone = ["Skill Power Special Bomb Modifier", "Skill Power Special Bomb Time Before Explosion Value"], from = "Carmilla", rename = { "Skill Power Special Bomb Modifier" = "Wolf Power Blood Seed Modifier", "Skill Power Special Bomb Time Before Explosion Value" = "Wolf Power Blood Seed Time Before Explosion Value" } },
    # The seed keeps Carmilla's own 1.5 s fuse (she links the modifier's
    # duration to this value); Thickening Blood stretches it to 2.5 s again
    # (the Duration factor at the end of this list).
    { link = "Wolf Power Blood Seed Modifier.duration", to = "Wolf Power Blood Seed Time Before Explosion Value" },
    { clone = ["Blood Bomb Explode Listener", "Skill Power Special Bomb Spawner"], from = "Carmilla", rename = { "Blood Bomb Explode Listener" = "Wolf Blood Bomb Explode Listener", "Skill Power Special Bomb Spawner" = "Wolf Blood Bomb Spawner" } },
    { remove_link = "Wolf Blood Bomb Spawner.spawner_values[0]" },
    { set = "Wolf Blood Bomb Spawner.template[1]", value = "own:Bomb" },
    { clone = ["Wolf Blood Bomb Spawner"], rename = { "Wolf Blood Bomb Spawner" = "Wolf Spread Bomb Spawner" } },
    { set = "Wolf Spread Bomb Spawner.template[1]", value = "own:SpreadBomb" },
    { event = "Event On Wolf Blood Bomb Explode" },
    { event = "Event Wolf Spread Bomb Spawn" },
    { event = "Event Wolf Normal Bomb Spawn" },
    { clone = ["Teleport Out From Deathdoor Or Regular Tester"], from = "Hero_Common", rename = { "Teleport Out From Deathdoor Or Regular Tester" = "Wolf Power Spread Tester" } },
    { link = "Wolf Power Spread Tester.test", to = "Skill Power Spread" },
    { link = "Wolf Power Spread Tester.on_true", to = "Event Wolf Spread Bomb Spawn" },
    { link = "Wolf Power Spread Tester.on_false", to = "Event Wolf Normal Bomb Spawn" },
    { add_link = "Event On Wolf Blood Bomb Explode.activates", to = "Wolf Power Spread Tester" },
    { add_link = "Event Wolf Spread Bomb Spawn.activates", to = "Wolf Spread Bomb Spawner" },
    { add_link = "Event Wolf Normal Bomb Spawn.activates", to = "Wolf Blood Bomb Spawner" },
    { link = "Wolf Blood Bomb Explode Listener.on_event", to = "Event On Wolf Blood Bomb Explode" },
    { override = "Child Event Initialize", from = "Character_Common/Character_Common" },
    { add_link = "Child Event Initialize.activates", to = "Wolf Blood Bomb Explode Listener" },
    { add_subobject = "Wolf Primary Ability Damage.bytes_36", from = "Carmilla", donor = "Skill Defense Aoe Bleed Damage.bytes_36[0]", replace_ref = { "Skill Defense Aoe Bleed Modifier" = "Wolf Power Blood Seed Modifier" } },
    { set = "Wolf Primary Ability Damage.value_27", value = 0.5 },
    # 3rd combo hit bleed: 50 at level 1, scaling with attack and level modifiers
    # (Level Damage Selector = 10 at lvl 1, * 5.0 * Basic Attack AP Multiplier Operation).
    { clone = ["Wolf Basic Attack Supposed Damage Operation", "Wolf Basic Attack Damage Multiplier"], from = "Red", rename = { "Wolf Basic Attack Supposed Damage Operation" = "Wolf Basic Attack Bleed Value Operation", "Wolf Basic Attack Damage Multiplier" = "Wolf Basic Attack Bleed Base Multiplier" } },
    { set = "Wolf Basic Attack Bleed Base Multiplier.value", value = 5.0 },
    { set = "Skill Attack Ability Step 3 Bleed On Attack Ability Step 3 Hit 1 Damage.duration", value = 5.0 },
    { link = "Skill Attack Ability Step 3 Bleed On Attack Ability Step 3 Hit 1 Damage.amount", to = "Wolf Basic Attack Bleed Value Operation" },
    # Match Scarlet's wolf basic attack forward cone AoE instead of a 360-degree circle.
    { clone = ["Wolf Basic Attack Traverser"], from = "Red", rename = { "Wolf Basic Attack Traverser" = "BloodWolf Basic Attack Traverser" } },
    { replace_subobject = "Attack Ability Step 1 Hit 1 Attack.attacks[0]", from = "Red", donor = "Wolf Basic Attack.attacks[0]", replace_ref = { "Wolf Basic Attack Damage" = "Attack Ability Step 1 Hit 1 Damage", "Wolf Basic Attack Traverser" = "BloodWolf Basic Attack Traverser" } },
    { replace_subobject = "Attack Ability Step 2 Hit 1 Attack.attacks[0]", from = "Red", donor = "Wolf Basic Attack.attacks[0]", replace_ref = { "Wolf Basic Attack Damage" = "Attack Ability Step 2 Hit 1 Damage", "Wolf Basic Attack Traverser" = "BloodWolf Basic Attack Traverser" } },
    { replace_subobject = "Attack Ability Step 3 Hit 1 Attack.attacks[0]", from = "Red", donor = "Wolf Basic Attack.attacks[0]", replace_ref = { "Wolf Basic Attack Damage" = "Attack Ability Step 3 Hit 1 Damage", "Wolf Basic Attack Traverser" = "BloodWolf Basic Attack Traverser" } },
    # Basic attack combo hit sound (Red's Wolf Basic Attack Impact FMod Event Default on steps 1-2,
    # Wolf Basic Attack Impact FMod Event Dash Attack on step 3 double strike).
    { event = "Wolf Basic Attack Hit Sound Event" },
    { clone = ["Wolf Basic Attack Impact FMod Event Default"], from = "Red", rename = { "Wolf Basic Attack Impact FMod Event Default" = "Wolf Basic Attack Impact FMod Event" } },
    { add_link = "Wolf Basic Attack Hit Sound Event.activates", to = "Wolf Basic Attack Impact FMod Event" },
    { link = "Attack Ability Step 1 Hit 1 Damage.ref_32", to = "Wolf Basic Attack Hit Sound Event" },
    { link = "Attack Ability Step 2 Hit 1 Damage.ref_32", to = "Wolf Basic Attack Hit Sound Event" },
    { event = "Wolf Basic Attack Step 3 Hit Sound Event" },
    { clone = ["Wolf Basic Attack Impact FMod Event Dash Attack"], from = "Red", rename = { "Wolf Basic Attack Impact FMod Event Dash Attack" = "Wolf Basic Attack Dash Impact FMod Event" } },
    { add_link = "Wolf Basic Attack Step 3 Hit Sound Event.activates", to = "Wolf Basic Attack Dash Impact FMod Event" },
    { link = "Attack Ability Step 3 Hit 1 Damage.ref_32", to = "Wolf Basic Attack Step 3 Hit Sound Event" },
    # Power targeting outside combat: Character Mesh / Entity Node world-forward returns (0,0,1);
    # use live Hero Controller aim (joystick/mouse) when no enemy target is detected.
    { retarget = "Wolf Primary Ability Target Dir", node = "Heroes/Hero_Common/Hero_Common|Hero Controller", from_kind = "3d graphic object" },
    # Spawn animation: attach Hero_Red's wolf spawn audio + footsteps and speed up by 30% (1.3x).
    { clone = ["Alt Footstep Run FMod Event", "Alt Footstep Walk FMod Event"], from = "Red", rename = { "Alt Footstep Run FMod Event" = "Wolf Spawn Footstep Run FMod Event", "Alt Footstep Walk FMod Event" = "Wolf Spawn Footstep Walk FMod Event" } },
    { link = "Spawning Default Appearance Anim.cinebloc[0]", to = "Spawning Default Appearance FMod Event" },
    { set = "Spawning Default Appearance Anim.cinebloc[0].start", value = 1.369 },
    { add_cinebloc = "Spawning Default Appearance Anim", to = "Wolf Spawn Footstep Run FMod Event", value = 1.436 },
    { add_cinebloc = "Spawning Default Appearance Anim", to = "Wolf Spawn Footstep Walk FMod Event", value = 1.576 },
    { animatic_speed = "Spawning Default Appearance Anim", value = 1.3 },
    # Delay State Intangible deactivation on RED_Wolf_Pimary_Bite_Out from 0.30s to 0.65s
    # so intangibility stays active continuously through the bite backlash recovery.
    { set = "Wolf Primary Ability Anim Bite.cinebloc[4].start", value = 0.65 },
    # Hurtbox/collision radius (0.7m, vs Character_Common's 0.5m and Scarlet wolf's 0.8m).
    { override = "Collision Radius", from = "Character_Common/Character_Common" },
    { set = "Collision Radius.value", value = 0.7 },
    # Allow Dash (and other actions) to interrupt Defense; interrupting exits State Defense Ability and drops its State Intangible.
    { set = "Defensive Ability Controller.value_8", value = true },
