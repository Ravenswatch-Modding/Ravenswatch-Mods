    { clone = ["Fx Wolf Primary Ability Impact"], rename = { "Fx Wolf Primary Ability Impact" = "Hyper Dash Character Impact Fx" } },
    { replace_subobject = "Hyper Dash Character Impact Fx.bytes_1[0]", donor = "Fx Wolf Primary Ability Impact.bytes_1[0]", replace_ref = { "Wolf Primary Ability Damage" = "Ultimate Ability Hit 1 Damage" } },
