# --- Buttons ---------------------------------------------------------------------
# (The game spells four of the wolf's button pictures "Ability_Wolf_" and their
# greyed twins "Ability_WOLF_": both are named as shipped.)
# Blood Fangs. The clone's three-hit combo, as three steps of its own: claw,
# claw, then the double strike, which is the hit that bleeds.
# Sound: Scarlet's own wolf attack sounds, her voice at the start of each
# claw and the slash as it lands (Pam, 2026-11-14: "no audio on the attack").
# Each step plays its whole clip, at Scarlet's own wolf timings (hit, chain
# window, exit): a step cut short ends before the next press is taken, and the
# combo restarted at step 1 every time (playtest 2026-11-13).
[content.frame.abilities.attack]
icon        = "Heroes\\Red\\Ability_Wolf_Attack.png"
icon_disabled = "Heroes\\Red\\Ability_WOLF_Attack_Disabled.png"
name        = "Blood Fangs"
description = "• A three-hit combo. The third hit makes enemies #Bleed@"
cooldown    = 0.3
combo       = [
    { clip = "Characters\\Heroes\\RED\\Animations\\Skills\\RED_Wolf_BasicAttack_Claws_1.fbx", hit_at = 0.37, sound = "Heroes\\Hero_Red\\Hero_Red.entity.ot | Wolf Basic Attack Anim FMod Event", swing = "Heroes\\Hero_Red\\Hero_Red.entity.ot | Wolf Basic Attack Active FMod Event", swing_at = 0.37, link_at = 0.42, exit_at = 0.62, hits = [ { radius = 2.8, damage = 150, stagger = 4, fx = "Settings\\Heroes\\Hero_Red_FX\\WOLF_Basic_Attack_Slash_01_L.vfx.ot" } ] },
    { clip = "Characters\\Heroes\\RED\\Animations\\Skills\\RED_Wolf_BasicAttack_Claws_2.fbx", hit_at = 0.37, sound = "Heroes\\Hero_Red\\Hero_Red.entity.ot | Wolf Basic Attack Anim FMod Event", swing = "Heroes\\Hero_Red\\Hero_Red.entity.ot | Wolf Basic Attack Active FMod Event", swing_at = 0.37, link_at = 0.42, exit_at = 0.62, hits = [ { radius = 2.8, damage = 150, stagger = 4, fx = "Settings\\Heroes\\Hero_Red_FX\\WOLF_Basic_Attack_Slash_01_R.vfx.ot" } ] },
    { clip = "Characters\\Heroes\\RED\\Animations\\Skills\\RED_Wolf_Skill_DoubleStrike.fbx", hit_at = 0.23, sound = "Heroes\\Hero_Red\\Hero_Red.entity.ot | Wolf Basic Attack Anim FMod Event", swing = "Heroes\\Hero_Red\\Hero_Red.entity.ot | Wolf Skill Dash Attack FMod Event Active", swing_at = 0.23, link_at = 0.6, exit_at = 0.8, hits = [ { radius = 3.2, damage = 180, stagger = 12, status = "Bleed", fx = "Settings\\Heroes\\Hero_Red_FX\\WOLF_Dash_Attack_Slash_01.vfx.ot", shake = "light" } ] },
]

# Blood Seed, as Pam made it in the clone (0.1): Scarlet's own wolf bite, lent
# whole (template): it rushes at the aimed enemy, bites at once if one is
# already in reach, plays the bite and its recovery, and is intangible
# throughout, with Scarlet's bite effects. Her talents on it are cut. The
# bite plants a blood seed IN the bitten enemy: Carmilla's blood-seed debuff
# on the bite's damage (frame.edits above). The seed bursts into Blood Wolf's
# bleed bomb when it runs out (1.5 s, or 2.5 s with Thickening Blood), or at
# once if the enemy dies first.
[content.frame.abilities.power]
icon        = "Heroes\\Red\\Ability_Wolf_Power.png"
icon_disabled = "Heroes\\Red\\Ability_WOLF_Power_Disabled.png"
name        = "Blood Seed"
description = "• Rush in and bite, planting a blood seed in what you bite. It bursts into a bleeding explosion shortly after, or as soon as the enemy dies"
template    = "Red: Wolf Primary"
cooldown    = 8
# Pam's clone: the bite's base hit at 1x (Scarlet's is higher).
values      = { "Wolf Primary Ability Damage Multiplier Default" = 1.0 }

# Dire Wolf. The special's howl calls a pet (`frame.pets` below) on the pet
# base, so it follows Blood Wolf and goes for the enemies. Pam (2026-11-14):
# the base special is the CLAW dire wolf; her Rabid talent turns it into the
# bite wolf that bursts.
[content.frame.abilities.special]
icon        = "Heroes\\Red\\Ability_Wolf_Special.png"
icon_disabled = "Heroes\\Red\\Ability_WOLF_Special_Disabled.png"
name        = "Dire Wolf"
description = "• Howl, and a dire wolf answers: it follows you and claws your enemies"
clip        = "Characters\\Heroes\\RED\\Animations\\Skills\\RED_Wolf_Defensive_Howl.fbx"
sound       = "Heroes\\Hero_Red\\Hero_Red.entity.ot | Wolf Defensive Ability Anim Default FMod Event"
duration    = 0.6
cooldown    = 12
moving      = true        # howled on the move, as the clone's special was


# One wolf per press of the special, a pet that follows Blood Wolf and charges
# the enemies, gone after 6 s (8 s with Rabid).
#   Base: the dire wolf as it fights by default, with its claw (Double Slash).
#   With Rabid (`upgrade`, while "Skill Special Rabid" is held): the bomber
#   wolf as Pam tuned it in the clone (0.1): blood-red, it bites instead, and
#   its first bite blows it up into its own bleed bomb (also if killed or
#   after 8 s): the hero's bomb, with the bleed it applies cut by 20%. The
#   bite: every enemy in a cone twice as wide and long, from closer, 35%
#   faster, retried 0.5 s after a miss, none of the enemy wolf's own debuffs.
[content.frame.pets]
entity          = "Enemies/Wolves/Standard_Wolf_Dire"
count           = 1
button          = "special"
spawn           = "button"
keep_ability    = true
counter         = "none"
aggro           = true
lifetime        = 6
appear          = "Characters\\Enemies\\Wolves\\Animations\\Wolf_DireTimber_UTurn_R.fbx"
burst           = "Heroes/Hero_Common/Hero_BloodWolf_ClawBomb"
look            = { albedo = "art/Dire_Blood_ALB.png" }
attack          = "Double Slash"
attack_combo    = false
attack_damage   = 15
attack_cooldown = 0
talent          = "Skill Special Rabid"
# `burst` names the bomb by its file, not "own:Bomb": RSMM 5.9.32 does not
# resolve own: inside `upgrade` (fixed in the next CLI), and the Rabid wolf
# then never exploded. The Rabid wolf bursts into its own bomb (RabidBomb), the
# hero's with the bleed it applies cut by 20%.
upgrade         = { appear = "Characters\\Enemies\\Wolves\\Animations\\Wolf_DireTimber_UTurn_R.fbx", look = { albedo = "art/Dire_Blood_ALB.png" }, lifetime = 8, burst = "Heroes/Hero_Common/Hero_BloodWolf_RabidBomb", burst_on_hit = true, attack = "Bite", attack_area = 1.2, attack_reach = 2.0, attack_range = 1.0, attack_targets = 0, attack_speed = 1.35, attack_debuffs = false, attack_cooldown = 0.5 }

